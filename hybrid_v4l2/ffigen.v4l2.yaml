# Run with `dart run ffigen --config ffigen.v4l2.yaml`.
name: LibV4L2
description: |
  Bindings for `v4l2`.

  Regenerate bindings with `dart run ffigen --config ffigen.v4l2.yaml`.
output: 'lib/src/ffi.v4l2.dart'
compiler-opts:
  - '-I/usr/include'
silence-enum-warning: true
headers:
  entry-points:
    - '/usr/include/linux/videodev2.h'
    - '/usr/include/linux/v4l2-common.h'
    - '/usr/include/linux/v4l2-controls.h'
  include-directives:
    - '/usr/include/linux/videodev2.h'
    - '/usr/include/linux/v4l2-common.h'
    - '/usr/include/linux/v4l2-controls.h'
# enums:
#   as-int:
#     include:
#       - '.*'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
