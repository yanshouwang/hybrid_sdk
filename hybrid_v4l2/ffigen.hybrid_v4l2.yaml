# Run with `dart run ffigen --config ffigen.hybrid_v4l2.yaml`.
name: LibHybridV4L2
description: |
  Bindings for `hybrid_v4l2`.

  Regenerate bindings with `dart run ffigen --config ffigen.hybrid_v4l2.yaml`.
output: 'lib/src/ffi.hybrid_v4l2.dart'
headers:
  entry-points:
    - 'src/hybrid_v4l2.h'
  include-directives:
    - 'src/hybrid_v4l2.h'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
