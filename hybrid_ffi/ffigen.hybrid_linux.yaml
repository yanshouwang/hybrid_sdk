# Run with `dart run ffigen --config ffigen.hybrid_linux.yaml`.
name: LibHybridLinux
description: |
  Bindings for `hybrid_linux`.

  Regenerate bindings with `dart run ffigen --config ffigen.hybrid_linux.yaml`.
output: 'lib/src/ffi.hybrid_linux.dart'
headers:
  entry-points:
    - 'linux/hybrid_linux.h'
  include-directives:
    - 'linux/hybrid_linux.h'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
