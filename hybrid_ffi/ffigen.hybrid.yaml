# Run with `dart run ffigen --config ffigen.hybrid.yaml`.
name: LibHybrid
description: |
  Bindings for `hybrid`.

  Regenerate bindings with `dart run ffigen --config ffigen.hybrid.yaml`.
output: 'lib/src/ffi.hybrid.dart'
headers:
  entry-points:
    - 'src/hybrid.h'
  include-directives:
    - 'src/hybrid.h'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
