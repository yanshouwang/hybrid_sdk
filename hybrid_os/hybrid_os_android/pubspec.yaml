name: hybrid_os_android
description: 'Android implementation of the hybrid_os plugin.'
version: 0.1.0-dev.3
repository: 'https://github.com/yanshouwang/hybrid_sdk'

environment:
  sdk: ^3.5.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  hybrid_os_platform_interface: ^0.1.0-dev.1
  jni: ^0.12.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  jnigen: ^0.12.2

flutter:
  plugin:
    implements: hybrid_os
    platforms:
      android:
        package: dev.hebei.hybrid_os_android
        pluginClass: HybridOSAndroidPlugin
        ffiPlugin: true
        dartPluginClass: HybridOSAndroidPlugin
